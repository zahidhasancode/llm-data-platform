apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sql-server
  template:
    metadata:
      labels:
        app: sql-server
    spec:
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: ecr
      containers:
        - name: server
          image: __IMAGE__
          env:
            - name: MODEL_VERSION
              value: "__VERSION__"
            - name: HF_HOME
              value: /models/hf
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          lifecycle:
            preStop:
              # Keep serving until the Service has stopped sending traffic here.
              exec:
                command: ["python", "-c", "import time; time.sleep(10)"]
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /models
---
apiVersion: v1
kind: Service
metadata:
  name: sql-server
spec:
  type: NodePort
  selector:
    app: sql-server
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
